# Render blueprint for the Hatch deploy broker.
#
# This lives at the REPO ROOT because that is the only place Render looks for a
# blueprint.
#
#   render.com → New → Blueprint → point at this repo
#
# The paths below deliberately match Render's DEFAULTS, so a service created the
# other way — New → Web Service, which ignores this file entirely — builds the
# same image instead of failing with
#
#     failed to read dockerfile: open Dockerfile: no such file or directory
#
# which is what a Web Service does when the only Dockerfile is in a
# subdirectory. The root ./Dockerfile prefixes its COPYs with hatch-deploy/, and
# the root .dockerignore keeps the context down to that directory, so nothing is
# lost by building from the top.
#
# hatch-deploy/Dockerfile still exists for building with that directory AS the
# context (`cd hatch-deploy && docker build .`). Keep the two in step.
#
# No `rootDir` here on purpose: it would re-root these paths and re-introduce
# exactly the confusion this comment is about.
services:
  - type: web
    name: hatch-deploy
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health

    # NOT the free/starter tier. Each concurrent build is an `npm install` plus
    # an `astro build` — roughly a gigabyte — and 512 MB will OOM mid-deploy.
    # Standard is the realistic floor; pair it with the concurrency setting below.
    plan: standard

    envVars:
      # This instance's own public URL. Render assigns one on first deploy;
      # set it after, or point it at your custom domain.
      - key: HATCH_DEPLOY_BASE
        sync: false

      # Public by default, so no credentials are needed. For a private repo see
      # the README — do NOT put a token here unless the broker includes the
      # clone-URL redaction, because the URL is written into the build log.
      - key: HATCH_REPO
        value: https://github.com/eticastudio/hatch.git
      - key: HATCH_BRANCH
        value: main

      # One at a time on a managed instance. The default of 3 assumes a 4 GB box.
      - key: HATCH_MAX_CONCURRENT_BUILDS
        value: "1"

      # Extra hosts the deployed frontend's image proxy may fetch from, on top
      # of the built-in list in hatch-deploy/lib/img-hosts.js. Comma-separated,
      # EXACT hostnames — the starter matches with `hosts.has(host)`, so a
      # wildcard like *.example.com is not a pattern, it is a name that matches
      # nothing. Leave unset unless a site pulls images from somewhere new.
      - key: HATCH_IMG_ALLOWED_HOSTS
        sync: false
